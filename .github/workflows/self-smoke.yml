name: self-smoke

# Real-execution proof for the three workflow_call templates: each job below
# calls one of this repo's own reusable workflows against a small fixture
# under fixtures/. actionlint-selfcheck.yml proves static parsing; this
# proves the call contract, the pinned actions resolve, `uv sync --frozen`
# works from a committed lockfile, `npm ci` + build + artifact upload work,
# and docker build + run + healthz retry loop works end to end.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The node template's upload-dist step needs actions: write; granted here
  # at the calling level so the reusable workflow stays inside caller caps.
  actions: write

concurrency:
  group: self-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python template
    uses: ./.github/workflows/reusable-python.yml
    with:
      project-directory: "fixtures/py-demo"
      sync-args: "--extra test"
      pytest-args: "--timeout=30 -q"

  node:
    name: node template
    uses: ./.github/workflows/reusable-node.yml
    with:
      working-directory: "fixtures/node-demo"
      build-command: "npm run build"
      lint-command: "npm run lint"
      upload-dist: true
      artifact-name: "fixture-dist"

  container-smoke:
    name: container smoke template
    uses: ./.github/workflows/reusable-container-smoke.yml
    with:
      image-name: "ci-harness-self-smoke:local"
      build-context: "fixtures/container-demo"
      run-args: "-p 8080:80"
      healthz-url: "http://127.0.0.1:8080/"
      healthz-attempts: 30
      healthz-delay-seconds: 2

  # Contract-currency heartbeat, both directions as POSITIVE assertions.
  # RED path: a permanently stale fixture (a0e3efb — the attestation-gap
  # pin; the library will never return there) through the real uses: call
  # with expect: noncurrent. The job goes green exactly when the gate
  # correctly REFUSES a drifted pin; if the probe ever goes soft, THIS job
  # goes red. (Shallow clones cannot prove fast-forward ancestry, so
  # BEHIND and DIVERGED are both accepted — nonzero is the guarantee.)
  contract-freshness-red:
    name: contract freshness — stale pin correctly refused
    uses: ./.github/workflows/reusable-contract-freshness.yml
    with:
      manifest-path: "fixtures/contract-demo/stale-adoption.yaml"
      expect: "noncurrent"

  # GREEN path: cannot be a committed fixture (any current pin rots the day
  # the library moves into a permanent red), so the manifest is generated
  # LIVE from git ls-remote and probed through the same tool call the
  # reusable performs. The uses:-level green path is proven on the consumer
  # side: personal-world PR #63 runs contract-freshness with expect:
  # current against the real ratified adoption manifest.
  contract-freshness-green:
    name: contract freshness — live pin reads CURRENT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Probe a manifest pinned to the LIVE default branch
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Rylee-Bee/play-nice-contracts.git "$RUNNER_TEMP/pnc"
          sha=$(git ls-remote https://github.com/Rylee-Bee/play-nice-contracts refs/heads/main | awk '{print $1}')
          test -n "$sha"
          sed "s/@PIN@/$sha/" fixtures/contract-demo/current-template.adoption.yaml > "$RUNNER_TEMP/current.adoption.yaml"
          python3 "$RUNNER_TEMP/pnc/tools/contractctl/contractctl.py" \
            freshness --manifest "$RUNNER_TEMP/current.adoption.yaml" --json
          echo "live-pinned manifest reads CURRENT — green path cannot rot"
