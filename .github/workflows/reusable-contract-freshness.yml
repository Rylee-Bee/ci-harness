name: reusable-contract-freshness

# ci-harness — Play-Nice contract freshness gate (workflow_call).
#
# Harness-owned mechanics: shallow-clone the authoritative contract source
# (Rylee-Bee/play-nice-contracts) over https, run its stdlib-only
# `contractctl freshness --manifest <caller manifest> --json`, and
# propagate the tool's exit code as the job's exit code. Repo-owned
# semantics: which manifest expresses the adoption pin
# (e.g. `.project/contracts/adoption.yaml`) and when the gate fires.
#
# Fail closed — proven, not asserted: the tool exits 0 ONLY on status
# CURRENT. BEHIND / DIVERGED exit 1; UNREACHABLE / UNKNOWN (including a
# missing or malformed manifest) exit 2. Anything red is red honestly.
#
# Why the clone is deliberately NOT pinned (see pins/ACTIONS.md): the
# cloned tool's own checkout revision is one of the pins `freshness`
# compares against the remote head. Pinning the clone to anything but the
# default-branch tip would force the verdict away from CURRENT forever.
# The revision under test is always the CONSUMER'S manifest pin, never
# this plumbing. Note a `--depth 1` clone cannot prove fast-forward
# ancestry for old commits, so a stale pin reports DIVERGED rather than
# BEHIND; both are nonzero, which is the guarantee consumers depend on.
#
# Honesty line: detection is automated; pin movement is manual. This
# template never syncs a pin — when it goes red, a human reads what
# changed upstream and re-pins in the consumer repo, or accepts the lag
# knowingly.

on:
  workflow_call:
    inputs:
      manifest-path:
        description: >-
          Adoption-v1 manifest to verify, relative to the calling repo root,
          e.g. ".project/contracts/adoption.yaml".
        type: string
        required: true
      expect:
        description: >-
          Required verdict. DEFAULT "current" = consumer semantics: red on
          ANY drift (BEHIND/DIVERGED/UNREACHABLE/UNKNOWN all fail). The
          harness's self-smoke passes "noncurrent" against a permanently
          stale fixture: the job goes GREEN exactly when the gate correctly
          refuses the drifted pin — GitHub forbids continue-on-error on
          uses: jobs, so this inversion is an explicit, readable input,
          never a swallowed failure. "noncurrent" accepts exactly
          BEHIND/DIVERGED with nonzero exit; nothing else.
        type: string
        required: false
        default: "current"
    outputs:
      exit-code:
        description: >-
          Process exit code of `contractctl freshness` (0 = CURRENT;
          1 = BEHIND/DIVERGED; 2 = UNREACHABLE/UNKNOWN or tool error).
        value: ${{ jobs.freshness.outputs.exit-code }}
      status:
        description: >-
          Machine verdict: CURRENT | BEHIND | DIVERGED | UNREACHABLE | UNKNOWN.
        value: ${{ jobs.freshness.outputs.status }}

permissions:
  contents: read

jobs:
  freshness:
    name: contract freshness
    runs-on: ubuntu-latest
    outputs:
      exit-code: ${{ steps.check.outputs.exit-code }}
      status: ${{ steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shallow-clone contract source (https, no credentials)
        run: >-
          git clone --depth 1
          https://github.com/Rylee-Bee/play-nice-contracts.git
          "${{ runner.temp }}/play-nice-contracts"
      - name: Contract freshness gate (fail closed)
        id: check
        shell: bash
        env:
          # Inputs travel via env, never interpolated into the script text.
          MANIFEST: ${{ github.workspace }}/${{ inputs.manifest-path }}
          CONTRACTCTL: ${{ runner.temp }}/play-nice-contracts/tools/contractctl/contractctl.py
          JSON_OUT: ${{ runner.temp }}/freshness.json
          EXPECT: ${{ inputs.expect }}
        run: |
          set +e
          python3 "$CONTRACTCTL" freshness --manifest "$MANIFEST" --json > "$JSON_OUT"
          rc=$?
          cat "$JSON_OUT"
          status=$(FRESHNESS_JSON="$JSON_OUT" python3 -c 'import json, os; print(json.load(open(os.environ["FRESHNESS_JSON"])).get("status", "UNKNOWN"))' 2>/dev/null) || status=UNKNOWN
          detail=$(FRESHNESS_JSON="$JSON_OUT" python3 -c 'import json, os; print(json.load(open(os.environ["FRESHNESS_JSON"])).get("detail", "")[:300])' 2>/dev/null) || detail=""
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$EXPECT" in
            current)
              if [ "$rc" -ne 0 ]; then
                echo "::error::contract freshness gate failed: status=$status (exit $rc) — ${detail:-no verdict detail; check the JSON above} — read what changed upstream, then re-pin source.revision in the manifest manually (a human decision; this check detects drift and never moves pins)"
                exit "$rc"
              fi
              echo "CURRENT — verdict green"
              ;;
            noncurrent)
              if [ "$rc" -eq 0 ] || { [ "$status" != "BEHIND" ] && [ "$status" != "DIVERGED" ]; }; then
                echo "::error::self-smoke inversion expects BEHIND or DIVERGED with nonzero exit; got status=$status exit=$rc — the fail-closed gate went soft"
                exit 1
              fi
              echo "stale pin correctly refused (status=$status exit=$rc) — the red path is genuinely red"
              ;;
            *)
              echo "::error::unknown expect='$EXPECT' (valid: current | noncurrent)"
              exit 2
              ;;
          esac
