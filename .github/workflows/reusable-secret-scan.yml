name: reusable-secret-scan

# ci-harness — reusable secret-scanning pipeline (workflow_call).
#
# Harness-owned mechanics: checkout (pinned), gitleaks-action (pinned).
# Repo-owned semantics: a repo-local .gitleaks.toml for allowlisting known
# false positives (e.g. base64 SRI hashes) — never suppress at the harness
# level, per this estate's leak-canary convention (documented false
# positives, not blanket exceptions).
#
# Every action SHA below comes from pins/ACTIONS.md — the single pinning
# source. Consumers declare ~5 lines per job; see README.md.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for every job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      fetch-depth:
        description: >-
          History depth to scan. 0 = full history (slower, thorough).
          A shallow default keeps PR checks fast; run a full-history scan
          separately/periodically if you need to catch older leaks.
        type: number
        required: false
        default: 1

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      # Telemetry is a side effect, never a gate: skipped entirely unless the
      # caller sets vars.OTEL_EXPORTER_OTLP_ENDPOINT, and unable to fail the job.
      - name: Telemetry - open job span
        if: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT != '' }}
        continue-on-error: true
        uses: Rylee-Bee/ci-harness/.github/actions/otel-span@main
        with:
          command: ci-open
          span-name: gitleaks
          change-id: ${{ github.event.pull_request.number }}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Callers grant least privilege (contents: read). The action's default
          # PR comment and artifact upload need write scopes and 403 with
          # "Resource not accessible by integration" — failing the job even when
          # the scan is clean (hit 2026-10-01 on rylee_lore, the first adopter).
          # A finding still fails the build (the gate), so turn the API-posting
          # features off instead of widening permissions.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Telemetry - close job span
        # always(): a scan that found a leak still reports what it was doing,
        # and the result below is the job's real outcome.
        if: ${{ always() && vars.OTEL_EXPORTER_OTLP_ENDPOINT != '' }}
        continue-on-error: true
        uses: Rylee-Bee/ci-harness/.github/actions/otel-span@main
        with:
          command: ci-close
          span-name: gitleaks
          result: ${{ job.status }}
